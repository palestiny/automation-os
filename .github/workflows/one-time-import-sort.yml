name: One-time import ordering

on:
  push:
    branches:
      - fix/download-security-auth-durability

permissions:
  contents: write

jobs:
  sort-imports:
    if: github.ref == 'refs/heads/fix/download-security-auth-durability'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Sort imports
        run: ruff check app tests scripts --select I --fix

      - name: Commit mechanical import ordering
        run: |
          if git diff --quiet; then
            echo "Imports are already sorted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests scripts
          git commit -m "style: sort Python imports"
          git push origin "HEAD:${GITHUB_REF_NAME}"
