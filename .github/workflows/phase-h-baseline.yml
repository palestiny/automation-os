name: Phase H Baseline Characterization

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - fix/phase-h-benchmark-isolation-timeouts
    paths:
      - ".github/workflows/phase-h-baseline.yml"
      - "scripts/benchmark_phase_h_postgres.py"
      - "app/application/execution_metrics.py"
      - "app/application/execution_recovery.py"
      - "app/domain/repositories.py"
      - "app/infrastructure/persistence/postgres_executions.py"
      - "app/infrastructure/persistence/in_memory.py"

permissions:
  contents: read

# Avoid overlapping expensive benchmark runs for the same pull request/ref.
concurrency:
  group: phase-h-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: automation_os
          POSTGRES_PASSWORD: automation_os
          POSTGRES_DB: automation_os_benchmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automation_os -d automation_os_benchmark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AUTOMATION_OS_BENCHMARK_DATABASE_URL: postgresql://automation_os:automation_os@localhost:5432/automation_os_benchmark

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record environment metadata
        run: |
          python --version
          python -m pip freeze
          python -c "import os, psycopg; c = psycopg.connect(os.environ['AUTOMATION_OS_BENCHMARK_DATABASE_URL']); print(c.execute('SELECT version()').fetchone()[0]); c.close()"

      - name: Run isolated Phase H characterization
        timeout-minutes: 5
        run: >-
          python scripts/benchmark_phase_h_postgres.py
          --database-url "$AUTOMATION_OS_BENCHMARK_DATABASE_URL"
          --confirm-disposable
          --sizes 100 500
          --repetitions 5
          --warmup 1
          --soak-seconds 30
          --history-events 3
          --seed 20261009
          --json-output phase-h-baseline.json

      - name: Upload baseline report
        if: always() && hashFiles('phase-h-baseline.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase-h-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase-h-baseline.json
          if-no-files-found: error
          retention-days: 30
