name: Tests

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: automation_os
          POSTGRES_PASSWORD: automation_os
          POSTGRES_DB: automation_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automation_os -d automation_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AUTOMATION_OS_TEST_DATABASE_URL: postgresql://automation_os:automation_os@localhost:5432/automation_os_test
      AUTOMATION_OS_DATABASE_URL: postgresql://automation_os:automation_os@localhost:5432/automation_os_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pip-audit ruff

      - name: Verify dependencies
        run: python -m pip check

      - name: Lint Python sources
        run: ruff check app tests scripts

      - name: Diagnose lint failures
        if: failure() && github.event_name == 'pull_request'
        run: |
          ruff check app tests scripts > CI_LINT_REPORT.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CI_LINT_REPORT.txt
          git commit -m "[skip ci] chore: capture lint diagnostics"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Apply database migrations
        run: python scripts/migrate_postgres.py

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Audit dependencies
        run: pip-audit -r requirements.txt
