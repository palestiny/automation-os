name: Tests

on:
  push:
    branches:
      - master
      - "feature/**"
      - "fix/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: automation_os
          POSTGRES_PASSWORD: automation_os
          POSTGRES_DB: automation_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automation_os -d automation_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AUTOMATION_OS_TEST_DATABASE_URL: postgresql://automation_os:automation_os@localhost:5432/automation_os_test
      AUTOMATION_OS_DATABASE_URL: postgresql://automation_os:automation_os@localhost:5432/automation_os_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify dependencies
        run: python -m pip check

      # B008 flags FastAPI's intentional Depends/Query defaults; other bugbear rules remain enabled.
      - name: Lint Python sources
        run: ruff check app tests scripts --select E9,F,B,DTZ,I --ignore B008

      - name: Compile Python sources
        run: python -m compileall -q app tests scripts

      - name: Apply database migrations
        run: python scripts/migrate_postgres.py

      - name: Smoke-test Phase H PostgreSQL benchmark harness
        run: >-
          python scripts/benchmark_phase_h_postgres.py
          --database-url "$AUTOMATION_OS_TEST_DATABASE_URL"
          --confirm-disposable
          --sizes 10 25
          --repetitions 2
          --warmup 1

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Audit runtime and development dependencies
        run: pip-audit -r requirements-dev.txt
