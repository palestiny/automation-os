name: Tests

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: automation_os
          POSTGRES_PASSWORD: automation_os
          POSTGRES_DB: automation_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automation_os -d automation_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AUTOMATION_OS_TEST_DATABASE_URL: postgresql://automation_os:automation_os@localhost:5432/automation_os_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest
